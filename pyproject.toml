[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scientometric-time-series"
version = "1.0.0"
description = "Evaluation utilities for scientometric time-series forecasting"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Roberto Dalcin Moutinho"}]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
